name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject token
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          sed -i "s|BOT_TOKEN|$BOT_TOKEN|g" js/feedback.js
          sed -i "s|CHAT_ID|$CHAT_ID|g" js/feedback.js 
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
